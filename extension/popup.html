<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
body{margin:0;width:380px;max-height:540px;background:#111827;color:#f9fafb;font:13px system-ui,Tahoma,sans-serif;display:flex;flex-direction:column}
.top{display:flex;gap:6px;padding:10px;border-bottom:1px solid #374151}
button{font:inherit;border:0;border-radius:8px;padding:7px 10px;color:#fff;background:#374151;cursor:pointer}
.top button{flex:1;background:#0f766e}
#warn{background:#7c2d12;padding:7px 10px;font-size:12px}
#list{overflow-y:auto;flex:1}
.row{display:flex;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid #1f2937}
.in{flex:1;min-width:0}.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mt{font-size:11px;color:#9ca3af}
.dl{background:#0f766e}.empty{padding:22px;text-align:center;color:#9ca3af}
</style></head>
<body>
<div class="top"><button id="pick">🎯 الالتقاط بالنقر</button><button id="panel">📋 لوحة الصفحة</button></div>
<div id="warn" hidden>⚠ الصفحة تستخدم حماية DRM — المحتوى المحمي لا يمكن تنزيله.</div>
<div id="list"></div>
<script src="popup.js"></script>
</body></html>
