name: Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK + AAR
        run: gradle --no-daemon :app:assembleRelease :mediagrabber:assembleRelease

      - name: Package browser extension
        run: |
          cd extension
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" manifest.json
          mkdir -p ../out
          zip -r "../out/MediaGrabber-extension-$VERSION.zip" . -x "*.DS_Store"

      - name: Collect Android outputs
        run: |
          cp app/build/outputs/apk/release/app-release.apk "out/MediaGrabber-sample-$VERSION.apk"
          cp mediagrabber/build/outputs/aar/mediagrabber-release.aar "out/mediagrabber-$VERSION.aar"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" out/* \
            --target "${{ github.sha }}" \
            --title "Media Grabber v$VERSION" \
            --notes "بناء تلقائي للـ commit ${{ github.sha }}"
